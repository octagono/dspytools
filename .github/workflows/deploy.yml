name: Deploy

on:
  workflow_run:
    workflows: ["Evaluation Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Promote Programs + Sync Artifacts
    runs-on: [self-hosted, gpu]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 10

    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dspytools
        run: pip install -e ".[dev]"

      - name: Download evaluation artifacts
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: evaluation-results
          path: ./

      - name: Verify MLflow reachable
        run: |
          curl -sf http://localhost:5000/health || {
            echo "MLflow not reachable — skipping registration"
            exit 0
          }

      - name: Register validated programs to MLflow
        run: |
          python3 << 'EOF'
          import mlflow
          import json
          from pathlib import Path
          from dspytools.core.registry import list_compiled_runs

          mlflow.set_tracking_uri("http://localhost:5000")
          mlflow.set_experiment("dspytools-deploy")

          runs = list_compiled_runs()
          if not runs:
              print("No compiled runs to register")
              exit(0)

          # Register the 5 most recent runs
          registered = 0
          for run in runs[-5:]:
              run_id = run.get("id", "unknown")
              score = run.get("score", 0.0)
              optimizer = run.get("optimizer", "unknown")
              module = run.get("module", "unknown")

              with mlflow.start_run(run_name=f"deploy_{run_id}"):
                  mlflow.log_dict(run, "run_metadata.json")
                  mlflow.set_tag("source", "ci-deploy")
                  mlflow.set_tag("optimizer", optimizer)
                  mlflow.set_tag("module", module)
                  mlflow.set_metric("score", float(score) if score else 0.0)

              registered += 1
              print(f"  Registered: {run_id} ({optimizer}, score={score})")

          print(f"\nTotal registered: {registered} runs")

          # Also check baseline
          baseline_file = Path("data/golden_baseline.json")
          if baseline_file.exists():
              baseline = json.loads(baseline_file.read_text())
              print(f"Current baseline score: {baseline.get('score', 'N/A')}%")
          EOF

      - name: Verify deployment health
        run: |
          echo "=== MLflow experiments ==="
          python3 -c "
          import mlflow
          mlflow.set_tracking_uri('http://localhost:5000')
          exps = mlflow.search_experiments()
          for e in exps:
              runs = mlflow.search_runs(experiment_ids=[e.experiment_id])
              print(f'  {e.name}: {len(runs)} runs')
          "

          echo ""
          echo "=== FalkorDB graph ==="
          dspytools graph stats || true

          echo ""
          echo "=== Deploy summary ==="
          echo "  Programs registered to MLflow: dspytools-deploy experiment"
          echo "  No hot-swap webhook in local mode (use dspytools server swap for manual)"
