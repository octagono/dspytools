name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-wheels:
    name: Build Wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: self-hosted
            platform: linux_x86_64
            label: self-hosted
          - os: ubuntu-latest
            platform: linux_x86_64
            label: cloud
          - os: macos-14
            platform: macosx_arm64
            label: cloud

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    if: ${{ matrix.label != 'self-hosted' || vars.ENABLE_SELF_HOSTED_RELEASE == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build hatchling

      # Mojo modules are optional — wheel falls back to Python fallback.
      # Self-hosted runners with Mojo SDK handle actual compilation.
      - name: Compile Mojo modules (if SDK available)
        continue-on-error: true
        run: |
          # Mojo SDK is optional — wheel falls back to Python fallback.
          # pixi-based Mojo installation is unreliable in CI (pixi.sh rate limits,
          # modular registry access restrictions). Skip Mojo compilation entirely
          # in cloud CI; self-hosted runners handle Mojo builds.
          echo "Mojo SDK not available — wheel will use Python fallback"
          echo "MOJO_BUILT=false" >> $GITHUB_ENV

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel contents
        run: |
          python -c "
          import zipfile, glob
          wheels = glob.glob('dist/*.whl')
          assert wheels, 'No wheel produced'
          w = wheels[0]
          print(f'Wheel: {w}')
          with zipfile.ZipFile(w) as z:
            names = z.namelist()
            print(f'  {len(names)} files')
            mojo = [n for n in names if '.so' in n or '.dylib' in n or 'mojo_modules' in n]
            if mojo:
              print(f'  Mojo binaries: {mojo}')
            else:
              print('  No Mojo binaries (Python fallback)')
          "

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.label }}
          path: dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Only publish from cloud builds (not self-hosted, which may lack PyPI creds)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*cloud*
          merge-artifacts: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
